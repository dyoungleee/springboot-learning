spring:
  datasource:
    url: jdbc:h2:mem:springbootdeveloper;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

    defer-datasource-initialization: true
